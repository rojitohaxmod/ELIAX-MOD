    <!-- AUDIO SOUND EFFECTS & GITHUB INTEGRATION SCRIPT -->
    <script>
        // ==========================================================
        // ⚙️ CONFIGURACIÓN DE TU REPOSITORIO DE GITHUB
        // ==========================================================
        // Cambia estos dos valores por tu usuario y nombre de repositorio:
        const GITHUB_USERNAME = "tu-usuario-de-github"rojitohaxmodz"
        const GITHUB_REPO = "tu-repositorio";"ELIAX-MOD"

        // 📂 OPCIÓN FALLBACK (Si prefieres subir archivos a una carpeta local del repo):
        const USE_FALLBACK_FILES = false; // Cambia a true si no usas GitHub Releases
        const FALLBACK_FILES = [
            { name: "ELIAX_MOD_V2_VIP.apk", size: "48.5 MB", url: "./archivos/ELIAX_MOD_V2_VIP.apk", downloads: 1420 },
            { name: "rojitohax_config_proxy.json", size: "1.2 MB", url: "./archivos/rojitohax_config_proxy.json", downloads: 980 }
        ];

        // Web Audio Synthesizer for Cyber SFX
        const playSFX = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                }
            } catch (e) {}
        };

        // Formateador de tamaño de bytes a MB/KB
        function formatBytes(bytes, decimals = 1) {
            if (!bytes || bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        // Obtener icono según extensión del archivo
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (ext === 'apk') return 'fa-mobile-screen-button';
            if (ext === 'json') return 'fa-sliders';
            if (ext === 'zip' || ext === 'rar' || ext === '7z') return 'fa-file-zipper';
            if (ext === 'exe') return 'fa-desktop';
            return 'fa-file-arrow-down';
        }

        // Cargar Releases de GitHub en tiempo real
        async function loadGitHubReleases() {
            const container = document.getElementById('downloadsList');
            const statusText = document.getElementById('systemStatus');

            // Comprobación de variables por defecto
            if (GITHUB_USERNAME === "tu-usuario-de-github" || GITHUB_REPO === "tu-repositorio") {
                showEmptyState(
                    "Configuración requerida", 
                    "Por favor actualiza <b>GITHUB_USERNAME</b> y <b>GITHUB_REPO</b> al inicio del código JavaScript con los datos de tu usuario y repositorio de GitHub."
                );
                return;
            }

            try {
                container.innerHTML = `
                    <div class="py-8 text-center flex flex-col items-center justify-center gap-3">
                        <i class="fa-solid fa-spinner animate-spin text-cyber-red text-3xl"></i>
                        <p class="font-mono text-sm text-gray-400">Conectando con GitHub API...</p>
                    </div>
                `;

                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/releases/latest`);

                if (!response.ok) {
                    if (USE_FALLBACK_FILES && FALLBACK_FILES.length > 0) {
                        renderFallbackFiles();
                        return;
                    }
                    showEmptyState(
                        "Esperando archivos en GitHub...", 
                        `No se encontraron <b>Releases</b> publicadas en el repositorio <span class="text-cyber-red">${GITHUB_USERNAME}/${GITHUB_REPO}</span>.<br><br>Ve a tu repositorio en GitHub > <i>Releases</i> > <i>Draft a new release</i> y adjunta tus archivos (APK, ZIP, etc.).`
                    );
                    return;
                }

                const release = await response.json();
                const assets = release.assets || [];

                if (assets.length === 0) {
                    if (USE_FALLBACK_FILES && FALLBACK_FILES.length > 0) {
                        renderFallbackFiles();
                        return;
                    }
                    showEmptyState(
                        "Release sin archivos adjuntos", 
                        `La release más reciente (<b>${release.tag_name || 'v1.0'}</b>) no tiene archivos adjuntos en GitHub Releases.`
                    );
                    return;
                }

                renderAssets(assets);
                if (statusText) statusText.innerText = `SYSTEM STATUS: ${assets.length} ARCHIVO(S) ONLINE`;

            } catch (error) {
                console.error("Error conectando con GitHub API:", error);
                if (USE_FALLBACK_FILES && FALLBACK_FILES.length > 0) {
                    renderFallbackFiles();
                } else {
                    showEmptyState(
                        "Error de conexión", 
                        "No se pudo consultar la API de GitHub. Revisa tu conexión a Internet o los nombres configurados del repositorio."
                    );
                }
            }
        }

        // Renderizar lista de archivos desde GitHub Releases
        function renderAssets(assets) {
            const container = document.getElementById('downloadsList');
            container.innerHTML = assets.map(asset => {
                const iconClass = getFileIcon(asset.name);
                const formattedSize = formatBytes(asset.size);
                const downloads = asset.download_count || 0;
                const downloadUrl = asset.browser_download_url;

                return `
                    <div class="bg-black/60 border border-cyber-border hover:border-cyber-red/70 rounded-xl p-4 transition-all duration-300 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 rounded-lg bg-cyber-darkRed/30 border border-cyber-red/50 flex items-center justify-center text-cyber-red shrink-0">
                                <i class="fa-solid ${iconClass} text-xl"></i>
                            </div>
                            <div class="min-w-0 text-left">
                                <h3 class="font-orbitron font-bold text-sm text-white flex items-center gap-2 truncate">
                                    <span class="truncate">${asset.name}</span>
                                </h3>
                                <p class="text-xs text-gray-400 font-mono flex items-center gap-2 flex-wrap">
                                    <span>Tamaño: ${formattedSize}</span>
                                    <span>•</span>
                                    <span class="text-cyber-red font-semibold"><i class="fa-solid fa-download text-[10px]"></i> ${downloads} descargas</span>
                                </p>
                            </div>
                        </div>
                        <button onclick="downloadDirectly('${downloadUrl}', '${asset.name}')" class="w-full sm:w-auto px-4 py-2.5 bg-cyber-red hover:bg-red-600 text-white font-orbitron text-xs font-bold rounded-lg shadow-[0_0_12px_rgba(255,0,60,0.4)] active:scale-95 transition-all flex items-center justify-center gap-2 shrink-0">
                            <i class="fa-solid fa-download"></i>
                            <span>DESCARGAR</span>
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Renderizar archivos usando array de Fallback local
        function renderFallbackFiles() {
            const container = document.getElementById('downloadsList');
            const statusText = document.getElementById('systemStatus');
            if (statusText) statusText.innerText = "SYSTEM STATUS: MODO REPO FOLDER";

            container.innerHTML = FALLBACK_FILES.map(file => {
                const iconClass = getFileIcon(file.name);
                return `
                    <div class="bg-black/60 border border-cyber-border hover:border-cyber-red/70 rounded-xl p-4 transition-all duration-300 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 rounded-lg bg-cyber-darkRed/30 border border-cyber-red/50 flex items-center justify-center text-cyber-red shrink-0">
                                <i class="fa-solid ${iconClass} text-xl"></i>
                            </div>
                            <div class="min-w-0 text-left">
                                <h3 class="font-orbitron font-bold text-sm text-white flex items-center gap-2 truncate">
                                    <span class="truncate">${file.name}</span>
                                </h3>
                                <p class="text-xs text-gray-400 font-mono flex items-center gap-2">
                                    <span>Tamaño: ${file.size}</span>
                                    <span>•</span>
                                    <span class="text-cyber-red font-semibold">Local Repo</span>
                                </p>
                            </div>
                        </div>
                        <button onclick="downloadDirectly('${file.url}', '${file.name}')" class="w-full sm:w-auto px-4 py-2.5 bg-cyber-red hover:bg-red-600 text-white font-orbitron text-xs font-bold rounded-lg shadow-[0_0_12px_rgba(255,0,60,0.4)] active:scale-95 transition-all flex items-center justify-center gap-2 shrink-0">
                            <i class="fa-solid fa-download"></i>
                            <span>DESCARGAR</span>
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Mostrar aviso/estado elegante si no hay archivos
        function showEmptyState(title, description) {
            const container = document.getElementById('downloadsList');
            container.innerHTML = `
                <div class="bg-black/50 border border-cyber-border/70 rounded-xl p-6 text-center flex flex-col items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-amber-500/10 border border-amber-500/40 flex items-center justify-center text-amber-400">
                        <i class="fa-solid fa-folder-open text-xl"></i>
                    </div>
                    <h3 class="font-orbitron font-bold text-white text-sm">${title}</h3>
                    <p class="text-xs text-gray-400 font-mono leading-relaxed max-w-sm">${description}</p>
                </div>
            `;
        }

        // Ejecutar descarga directa desde URL de GitHub con animación
        function downloadDirectly(url, filename) {
            playSFX('click');
            const widget = document.getElementById('progressWidget');
            const nameEl = document.getElementById('downloadFileName');
            const percentEl = document.getElementById('downloadPercent');
            const barEl = document.getElementById('progressBar');

            widget.classList.remove('hidden');
            nameEl.innerText = filename;
            barEl.style.width = '0%';
            percentEl.innerText = '0%';

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 30) + 20;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    barEl.style.width = '100%';
                    percentEl.innerText = '100%';
                    playSFX('success');
                    showToast(`Descargando ${filename}...`, "success");
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    setTimeout(() => {
                        widget.classList.add('hidden');
                    }, 2500);
                } else {
                    barEl.style.width = progress + '%';
                    percentEl.innerText = progress + '%';
                }
            }, 100);
        }

        // Custom Toast Notifications
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const isSuccess = type === 'success';
            const borderColor = isSuccess ? 'border-emerald-500' : 'border-cyber-red';
            const icon = isSuccess ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-cyber-red';

            toast.className = `pointer-events-auto bg-black/90 border ${borderColor} text-white px-4 py-3 rounded-lg shadow-[0_0_15px_rgba(0,0,0,0.8)] font-mono text-xs flex items-center gap-3 transform translate-y-[-10px] opacity-0 transition-all duration-300`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-base"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-[-10px]', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Live Ping Simulation
        setInterval(() => {
            const pingEl = document.getElementById('pingValue');
            if (pingEl) {
                const randomPing = Math.floor(Math.random() * 8) + 15;
                pingEl.innerText = `${randomPing}ms`;
            }
        }, 3000);

        // Cargar descargas al iniciar la ventana
        window.onload = function() {
            loadGitHubReleases();
        };
    </script>
</body>
